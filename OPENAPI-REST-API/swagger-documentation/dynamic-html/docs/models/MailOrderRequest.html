
<h2>MailOrderRequest</h2>
<ul class="parameter">
  <li class="param-required-true">serviceType : Integer
    <br/>Mail plan service type id from getNewMail.serviceTypes (must be buyable).
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">coupon : String
    <br/>Coupon code.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">comment : String
    <br/>Free-form note saved on the service row (used on addMail).
  </li>
</ul>
