
<h2>FloatingIpOrderRequest</h2>
<ul class="parameter">
  <li class="param-required-true">serviceType : Integer
    <br/>Floating IP plan service type id from getNewFloatingIp.serviceTypes (must be buyable).
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">coupon : String
    <br/>Coupon code.
  </li>
</ul>
<ul class="parameter">
  <li class="param-required-false">comment : String
    <br/>Free-form note saved on the service row (used on addFloatingIp).
  </li>
</ul>
