# OpenAPI Generator JavaScript Client Configuration
# Optimized for ES6+, Node.js/Browser compatibility, and npm package standards

# === Sorting Options ===
# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# === Unicode & Naming ===
# Disallow unicode identifiers in names (keeps names ASCII-safe for npm)
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false

# === Discriminator & Schema Options ===
# Set to false for better discriminator support (true is legacy behavior)
legacyDiscriminatorBehavior: false

# Ensure additionalProperties behavior is OAS-compliant
disallowAdditionalPropertiesIfNotPresent: false

# Handle unknown enum cases gracefully (adds unknown_default_open_api case)
enumUnknownDefaultCase: true

# === Source & Package Structure ===
# Source folder for generated code
sourceFolder: src

# Package for API classes (empty = root level)
# apiPackage: api

# Package for model classes (empty = root level)
# modelPackage: model

# === npm Package Metadata ===
# Name of the npm package
projectName: interserver-api-client

# Module name for AMD/Node/globals
moduleName: InterserverApiClient

# Project description
projectDescription: "InterServer Management API - JavaScript client library for managing InterServer services including hosting, VPS, dedicated servers, domains, email, and billing."

# Project version
projectVersion: "1.0.0"

# License name
licenseName: "MIT"

# === JavaScript/ES6+ Options ===
# Use Promises for async/await support instead of callbacks
usePromises: true

# Use JavaScript ES6 (ECMAScript 6) - Required for modern async/await
useES6: true

# Use JavaScript prototype chains & delegation for inheritance
useInheritance: true

# Use URLSearchParams instead of deprecated querystring library
useURLSearchParams: true

# === Model & Property Options ===
# Naming convention for properties: camelCase, PascalCase, snake_case, or original
modelPropertyNaming: camelCase

# Generate getters and setters for model properties
emitModelMethods: false

# Generate JSDoc comments
emitJSDoc: true

# === Output Options ===
# Hide the generation timestamp when files are generated
hideGenerationTimestamp: true

# Skip setting default user-agent in ApiClient
skipDefaultUserAgent: false

# === Library Template ===
# JavaScript client library template
library: javascript
