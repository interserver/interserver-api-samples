# OpenAPI Generator Configuration for PHP-Nextgen Client
# Optimized for PHP 8.1+ with PSR autoloading and modern best practices

# ===================
# Package Naming (PSR-4 Autoloading)
# ===================
# Root namespace for all classes - follows PSR-4 autoloading standard
invokerPackage: Interserver\ApiClient

# Package/namespace for generated model classes (relative to invokerPackage)
modelPackage: Model

# Package/namespace for generated API classes (relative to invokerPackage)
apiPackage: Api

# Main package name for composer.json
packageName: interserver/api-client

# Composer package name (lowercase with vendor/project format)
composerPackageName: interserver/api-client

# ===================
# Code Generation Options
# ===================
# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false

# Hides the generation timestamp when files are generated
hideGenerationTimestamp: true

# Use snake_case for variable naming (PHP convention)
variableNamingConvention: snake_case

# Allow unicode identifiers in names (disabled for security)
allowUnicodeIdentifiers: false

# ===================
# Enum Options
# ===================
# If the server adds new enum cases that are unknown, handle gracefully
enumUnknownDefaultCase: false

# ===================
# Compatibility Options
# ===================
# Use legacy discriminator behavior for backward compatibility
legacyDiscriminatorBehavior: true

# HTTP library - psr-18 for HTTP client abstraction (avoids Guzzle CVE-2026-55568)
library: psr-18

# If false, the 'additionalProperties' implementation is compliant with OAS
disallowAdditionalPropertiesIfNotPresent: false

# ===================
# Metadata
# ===================
# The version to use in the composer package version field
artifactVersion: 1.0.0

# The name of the license
licenseName: MIT

# Developer organization
developerOrganization: Interserver, Inc.

# Developer organization URL
developerOrganizationUrl: https://www.interserver.net
