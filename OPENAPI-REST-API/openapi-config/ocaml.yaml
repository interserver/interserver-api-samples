# OpenAPI Generator Configuration for OCaml
# Optimized for Interserver API using CoHTTP + Yojson

# ============================================================================
# OCaml Generator Notes:
# - HTTP Client: CoHTTP (cohttp-lwt-unix, cohttp-async) - hardcoded, not configurable
# - JSON Library: Yojson with ppx_deriving_yojson - hardcoded, not configurable
# - Note: "Jsonm" is NOT supported by this generator; Yojson is used instead
# ============================================================================

# ============================================================================
# Parameter & Model Sorting
# ============================================================================

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: "true"

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: "true"

# Ensure parameter names are unique in an operation
ensureUniqueParams: "true"

# ============================================================================
# Naming Conventions
# ============================================================================

# Allow unicode identifiers in names
allowUnicodeIdentifiers: "false"

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: "false"

# ============================================================================
# Enum & Discriminator Options
# ============================================================================

# Set to false for generators with better discriminator support
legacyDiscriminatorBehavior: "true"

# If the server adds new enum cases unknown by old spec/client,
# client will fail to parse. Enable to add 'unknown_default_open_api' case
enumUnknownDefaultCase: "false"

# ============================================================================
# Additional Properties
# ============================================================================

# If false, additionalProperties is compliant with OAS and JSON schema specs
# If true (default), keeps old behavior where additionalProperties is false by default
disallowAdditionalPropertiesIfNotPresent: "true"

# ============================================================================
# Output Options
# ============================================================================

# Hide the generation timestamp in generated files
# Note: OCaml generator header only shows "Generated by: https://openapi-generator.tech"
# This option removes any timestamp that might appear in some generators
hideGenerationTimestamp: "true"
