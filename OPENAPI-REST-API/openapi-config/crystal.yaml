# OpenAPI Generator Crystal Configuration for Interserver API Client
# Optimized for proper shard naming, Crystal HTTP client (Crest), and JSON serialization

# Sort method arguments to place required parameters before optional parameters.
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters.
sortModelPropertiesByRequiredFlag: true

# Whether to ensure parameter names are unique in an operation (rename parameters that are not).
ensureUniqueParams: true

# boolean, toggles whether unicode identifiers are allowed in names or not, default is false
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list.
prependFormOrBodyParameters: false

# Set to false for generators with better support for discriminators.
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
disallowAdditionalPropertiesIfNotPresent: true

# If the server adds new enum cases, that are unknown by an old spec/client, the client will fail to parse the network response.
enumUnknownDefaultCase: true

# Crystal Shard Configuration
# Proper shard naming following Crystal conventions (snake_case for shard, CamelCase for module)
shardName: interserver_api_client
moduleName: InterserverApiClient
shardVersion: 1.0.0
shardLicense: MIT
shardHomepage: https://www.interserver.net
shardDescription: Official Crystal HTTP client for Interserver API. Generated from OpenAPI specification.

# Hides the generation timestamp when files are generated.
hideGenerationTimestamp: true

# Crystal HTTP client (Crest) settings
# Crest::NestedParamsEncoder handles nested query parameters
paramsEncoder: Crest::NestedParamsEncoder

# Sub-namespace for API classes to separate from models
apiNamespace: Api
