# OpenAPI Generator Perl Client Configuration
# Optimized for interserver-api-samples project

# Description: Perl module name (convention: CamelCase or Long::Module).
# Using proper Perl namespace convention for API client
moduleName: InterServerAPI

# Description: Perl module version.
moduleVersion: 1.0.0

# Description: Sort method arguments to place required parameters before optional parameters.
sortParamsByRequiredFlag: true

# Description: Whether to ensure parameter names are unique in an operation (rename parameters that are not).
ensureUniqueParams: true

# Description: Hides the generation timestamp when files are generated.
hideGenerationTimestamp: true

# Description: Add form or body parameters to the beginning of the parameter list.
prependFormOrBodyParameters: false

# Sort model properties to place required parameters before optional parameters.
sortModelPropertiesByRequiredFlag: true

# boolean, toggles whether unicode identifiers are allowed in names or not, default is false
allowUnicodeIdentifiers: false

# Set to false for generators with better support for discriminators.
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
disallowAdditionalPropertiesIfNotPresent: true

# If the server adds new enum cases, handle gracefully
enumUnknownDefaultCase: true
