# OpenAPI Generator config for Groovy
# Optimized for interserver-api-samples project

# Sort method arguments to place required parameters before optional parameters.
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters.
sortModelPropertiesByRequiredFlag: true

# Whether to ensure parameter names are unique in an operation (rename parameters that are not).
ensureUniqueParams: true

# boolean, toggles whether unicode identifiers are allowed in names or not, default is false
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list.
prependFormOrBodyParameters: true

# Set to false for generators with better support for discriminators.
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
disallowAdditionalPropertiesIfNotPresent: true

# Package for generated models - interserver brand
modelPackage: com.interserver.model

# Package for generated api classes - interserver brand
apiPackage: com.interserver.api

# Root package for generated code - interserver brand
invokerPackage: com.interserver

# groupId in generated pom.xml
groupId: com.interserver

# artifactId in generated pom.xml
artifactId: interserver-api-client

# artifact version in generated pom.xml
artifactVersion: 1.0.0

# SCM connection in generated pom.xml
scmConnection: scm:git:git@github.com:interserver/interserver-api-samples.git

# SCM developer connection in generated pom.xml
scmDeveloperConnection: scm:git:git@github.com:interserver/interserver-api-samples.git

# SCM URL in generated pom.xml
scmUrl: https://github.com/interserver/interserver-api-samples

# Developer name in generated pom.xml
developerName: Interserver API Team

# Developer email in generated pom.xml
developerEmail: api@interserver.com

# Developer organization in generated pom.xml
developerOrganization: Interserver

# Developer organization URL in generated pom.xml
developerOrganizationUrl: https://www.interserver.net

# The name of the license
licenseName: MIT

# The URL of the license
licenseUrl: https://opensource.org/licenses/MIT

# Source folder for generated code
sourceFolder: src/main/groovy

# boolean - toggle "implements Serializable" for generated models
serializableModel: false

# Treat BigDecimal values as Strings to avoid precision loss.
bigDecimalAsString: true

# Whether the discriminator value lookup should be case-sensitive or not.
discriminatorCaseSensitive: true

# Hides the generation timestamp when files are generated.
hideGenerationTimestamp: true

# Whether to include support for application/xml content type and include XML annotations in the model
withXml: false

# Use Java 8 native JSR310 for date/time (preferred for jdk 1.8+)
dateLibrary: java8

# Disable HTML escaping of JSON strings when using gson
disableHtmlEscaping: false

# Set booleanGetterPrefix
booleanGetterPrefix: get

# Ignore anyOf keyword in enum
ignoreAnyOfInEnum: false

# Enable OpenAPI Jackson Nullable library
openApiNullable: true

# Whether to generate builders for models
generateBuilders: true

# Whether to generate a constructor for all arguments
generateConstructorWithAllArgs: false

# Initialize containers (array/set/map) to empty containers instead of null by default
defaultToEmptyContainer: false

# Set containers (array, set, map) default to null
containerDefaultToNull: true

# Naming convention for enum properties
enumPropertyNaming: MACRO_CASE

# Skip header parameters in the generated API methods using @ApiImplicitParams annotation
implicitHeaders: false

# If the server adds new enum cases, that are unknown by an old spec/client, the client will fail to parse the network response. With this option enabled, each enum will have a new case, 'unknown_default_open_api'
enumUnknownDefaultCase: false

# Ignore discriminator field type for Jackson serialization
disableDiscriminatorJsonIgnoreProperties: false

# Fix camelCase when starting with $ sign
camelCaseDollarSign: false

# Whether to use Jakarta EE namespace instead of javax
useJakartaEe: false
