# OpenAPI Generator Rust Client Configuration
# Optimized for async/await with Tokio and Reqwest

# Rust package name (snake_case convention)
packageName: myadmin_api_client

# Rust package version
packageVersion: 1.0.0

# Hide generation timestamp to keep builds reproducible
hideGenerationTimestamp: true

# Use single request parameter for cleaner API calls
useSingleRequestParameter: true

# Enable async/await support with Tokio
supportAsync: true

# Use Serde for JSON serialization (enabled by default but explicit for clarity)
# Note: serde is automatically included with reqwest template

# Use chrono for date/time parsing
useChrono: true

# Prefer unsigned integers where appropriate
preferUnsignedInt: true

# Use best fitting integer types based on min/max constraints
bestFitInt: true

# Use reqwest with native-tls for HTTPS support
library: reqwest

# Default features for reqwest
reqwestDefaultFeatures: native-tls
