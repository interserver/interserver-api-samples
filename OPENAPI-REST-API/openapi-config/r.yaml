# OpenAPI Generator R Client Configuration
# Optimized for interserver-api-samples

# R package name (convention: lowercase)
packageName: interserverapi

# R package version
packageVersion: 1.0.0

# Hide generation timestamp when files are generated
hideGenerationTimestamp: "true"

# Use httr for HTTP requests
library: httr

# Throw an exception on non success response codes
returnExceptionOnFailure: "false"

# Exception handling package
exceptionPackage: default

# Keep additionalProperties behavior compliant with OAS/JSON schema
disallowAdditionalPropertiesIfNotPresent: "true"
