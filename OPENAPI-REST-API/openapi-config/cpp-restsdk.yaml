# C++ REST SDK (cpprestsdk) OpenAPI Generator Configuration
# Optimized for InterServer API client library generation

# C++ package (library) name - proper CamelCase naming
packageName: InterserverApiClient

# C++ namespace for models (convention: name.space.model)
# Using reverse domain notation with :: separator for C++
modelPackage: net.interserver.api.model

# C++ namespace for apis (convention: name.space.api)
apiPackage: net.interserver.api

# C++ package version
packageVersion: 1.0.0

# Prefix to prepend to reserved words in order to avoid conflicts
reservedWordPrefix: r_

# Make first character of variable name uppercase (eg. value -> Value)
variableNameFirstCharacterUppercase: true

# Generate Google Mock classes for APIs (disabled by default for cleaner output)
# generateGMocksForApis: false
