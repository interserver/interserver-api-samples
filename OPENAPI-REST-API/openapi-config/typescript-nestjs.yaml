# OpenAPI Generator Configuration for TypeScript-NestJS
# Optimized for InterServer Management API

# ============================================================================
# Output & Naming Conventions
# ============================================================================

# Hide the generation timestamp in generated files
hideGenerationTimestamp: true

# Naming convention for output files: 'camelCase', 'kebab-case'
# Using kebab-case which is conventional for Node.js/npm packages
fileNaming: kebab-case

# ============================================================================
# NPM Package Configuration
# ============================================================================

# The name under which you want to publish generated npm package
npmName: "@interserver/api-client"

# The version of your npm package
npmVersion: "1.0.0"

# Use snapshot versions for development
snapshot: false

# ============================================================================
# Model & Enum Configuration
# ============================================================================

# Naming convention for the property: 'camelCase', 'PascalCase', 'snake_case' and 'original'
# Using 'original' to preserve names as defined in the OpenAPI spec
modelPropertyNaming: original

# Naming convention for enum properties: 'camelCase', 'PascalCase', 'snake_case', 'UPPERCASE', and 'original'
enumPropertyNaming: PascalCase

# Suffix that will be appended to all enum names
enumNameSuffix: Enum

# Generate string enums instead of objects for enum values
# String enums are more type-safe and easier to serialize
stringEnums: true

# Use discriminators to create tagged unions instead of extending interfaces
taggedUnions: false

# ============================================================================
# Parameter Configuration
# ============================================================================

# Naming convention for parameters: 'camelCase', 'PascalCase', 'snake_case' and 'original'
paramNaming: camelCase

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Whether to ensure parameter names are unique in an operation
ensureUniqueParams: true

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false

# ============================================================================
# NestJS-Specific Configuration
# ============================================================================

# The version of Nestjs - using 8.0.0 for new HttpModule and HttpService from @nestjs/axios
nestVersion: "8.0.0"

# The suffix of the generated service
serviceSuffix: Service

# The suffix of the file of the generated service
serviceFileSuffix: .service

# Setting this property to true will generate interfaces next to the default class implementations
# Interfaces provide better type checking and separation of concerns
withInterfaces: true

# ============================================================================
# Additional Properties Configuration
# ============================================================================

# Set to make additional properties types declare that their indexer may return undefined
nullSafeAdditionalProps: false

# If the server adds new enum cases, that are unknown by an old spec/client,
# the client will fail to parse the network response. With this option enabled,
# each enum will have a new case, 'unknown_default_open_api'
enumUnknownDefaultCase: false

# ============================================================================
# Compatibility Settings
# ============================================================================

# Set to false for generators with better support for discriminators
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications
disallowAdditionalPropertiesIfNotPresent: false

# boolean, toggles whether unicode identifiers are allowed in names or not
allowUnicodeIdentifiers: false

# Setting this property to true will generate functions with a single argument containing all API endpoint parameters
useSingleRequestParameter: false

# The name of the license
licenseName: Unlicense
