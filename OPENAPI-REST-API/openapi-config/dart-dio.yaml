# OpenAPI Generator Configuration for Dart/Dio (Flutter)
# Optimized for Flutter applications with Dio HTTP client

# ====================
# Package Information
# ====================

# Library name in generated code
pubLibrary: interserver_api

# Name in generated pubspec
pubName: interserver_api

# Version in generated pubspec
pubVersion: 1.0.0

# Description in generated pubspec
pubDescription: Interserver API client generated from OpenAPI spec

# Author name in generated pubspec
pubAuthor: Interserver

# Email address of the author in generated pubspec
pubAuthorEmail: support@interserver.net

# Homepage in generated pubspec
pubHomepage: https://interserver.net

# Repository in generated pubspec
pubRepository: https://github.com/interserver/interserver-api-samples

# ====================
# Generation Options
# ====================

# Hide the generation timestamp in generated files
hideGenerationTimestamp: true

# Source folder for generated code
sourceFolder: lib

# ====================
# Dart/Flutter Options
# ====================

# Use Optional<T> to distinguish absent, null, and present for optional fields (Dart 3+ null safety)
useOptional: true

# Only apply Optional<T> to PATCH operation request bodies (requires useOptional=true)
patchOnly: false

# Add 'final' to class properties, making them immutable
useFinalProperties: true

# Whether properties are marked as final when using Json Serializable for serialization
finalProperties: true

# ====================
# Serialization Options
# ====================

# Specify serialization library
# Available values: built_value (default), json_serializable
serializationLibrary: json_serializable

# Specify equality check method (only for json_serializable)
# Available values: default, equatable
equalityCheckMethod: equatable

# ====================
# Date/Time Options
# ====================

# Specify Date library
# Available values: core (Dart core library), timemachine (Flutter timezone support)
dateLibrary: timemachine

# ====================
# Parameter/Model Options
# ====================

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: true

# ====================
# Enum Options
# ====================

# Allow the 'x-enum-values' extension for enums
useEnumExtension: true

# If the server adds new enum cases, handle them gracefully
enumUnknownDefaultCase: true

# ====================
# Discriminator Options
# ====================

# Set to false for generators with better support for discriminators
legacyDiscriminatorBehavior: false

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications
disallowAdditionalPropertiesIfNotPresent: false

# ====================
# Naming Options
# ====================

# Boolean, toggles whether unicode identifiers are allowed in names or not
allowUnicodeIdentifiers: false
