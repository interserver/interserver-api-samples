# OpenAPI Generator Ruby Client Configuration
# Optimized for Ruby 3.x with Faraday HTTP client

# Sort method arguments to place required parameters before optional parameters.
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters.
sortModelPropertiesByRequiredFlag: true

# Whether to ensure parameter names are unique in an operation (rename parameters that are not).
ensureUniqueParams: true

# boolean, toggles whether unicode identifiers are allowed in names or not
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list.
prependFormOrBodyParameters: false

# Set to false for generators with better support for discriminators.
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
disallowAdditionalPropertiesIfNotPresent: false

# gem name (convention: underscore_case/snake_case).
gemName: inter_server_client

# top module name (convention: PascalCase/CamelCase).
moduleName: InterServerClient

# gem version.
gemVersion: 1.0.0

# gem license.
gemLicense: MIT

# gem required Ruby version (Ruby 3.x compatible).
gemRequiredRubyVersion: ">= 3.0"

# gem homepage.
gemHomepage: https://github.com/interserver/inter-server-api

# gem summary.
gemSummary: Ruby client SDK for Interserver API

# gem description.
gemDescription: A Ruby wrapper for the Interserver REST APIs with Faraday HTTP client support.

# gem author.
gemAuthor: Interserver

# gem author email.
gemAuthorEmail: api@interserver.net

# Hides the generation timestamp when files are generated.
hideGenerationTimestamp: true

# Use autoload instead of require to load modules.
useAutoload: false

# HTTP library template to use (Faraday >= 1.0.1 recommended).
# Available Values:
#    faraday - Faraday >= 1.0.1 (https://github.com/lostisland/faraday)
#    httpx - HTTPX >= 1.0.0 (https://gitlab.com/os85/httpx)
#    typhoeus - Typhoeus >= 1.0.1 (https://github.com/typhoeus/typhoeus)
library: faraday

# If the server adds new enum cases that are unknown by an old spec/client,
# the client will fail to parse the network response. With this option enabled,
# each enum will have a new case, 'unknown_default_open_api'.
enumUnknownDefaultCase: false
