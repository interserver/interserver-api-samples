# OpenAPI Generator Configuration for Kotlin Client
# Optimized for Kotlin with Coroutines and OkHttp4

# ===================
# Package Naming
# ===================
# Root package for generated code
packageName: io.interserver.client

# Generated artifact package's organization (i.e. maven groupId)
groupId: io.interserver

# Generated artifact id (name of jar)
artifactId: interserver-kotlin-client

# Generated artifact's package version
artifactVersion: 1.0.0

# ===================
# Source & Build
# ===================
# Source folder for generated code
sourceFolder: src/main/kotlin

# ===================
# API Options
# ===================
# Suffix for API classes
apiSuffix: Api

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# Hides the generation timestamp when files are generated
hideGenerationTimestamp: true

# ===================
# Model Options
# ===================
# Create mutable models (false = immutable data classes)
modelMutable: false

# Naming convention for enum properties
enumPropertyNaming: camelCase

# Boolean - toggle "implements Serializable" for generated models
# serializableModel: false

# ===================
# Library Selection
# ===================
# Library template (sub-template) to use
# jvm-okhttp4: HTTP client: OkHttp 4.2.0 (Android 5.0+ and Java 8+). JSON processing: Moshi 1.8.0.
library: jvm-okhttp4

# ===================
# Coroutines Support
# ===================
# Whether to use the Coroutines adapter with the retrofit2 library
# Note: When using OkHttp4, coroutines are supported via suspend functions natively
useCoroutines: true

# ===================
# Serialization
# ===================
# What serialization library to use: 'moshi' (default), 'gson', 'jackson', or 'kotlinx_serialization'
serializationLibrary: moshi

# Fail Jackson de-serialization on unknown properties
failOnUnknownProperties: false

# ===================
# Date/Time Options
# ===================
# Option. Date library to use
# java8: Java 8 native JSR310 (preferred for jdk 1.8+)
dateLibrary: java8

# JVM-Option. Defines how to handle date-time objects for requests
# toJson: Date formatter option using a json converter (default)
requestDateConverter: toJson

# ===================
# Collection Options
# ===================
# Option. Collection type to use
# list: kotlin.collections.List (default)
collectionType: list

# ===================
# Headers & Parameters
# ===================
# Skip header parameters in the generated API methods
implicitHeaders: false

# Allow to use non-ascii headers with the okhttp library
useNonAsciiHeaders: false

# ===================
# Response Options
# ===================
# When using retrofit2 and coroutines, use Response<T> as return type instead of T
useResponseAsReturnType: true

# ===================
# Documentation
# ===================
# Select the OpenAPI documentation provider
# none: Do not publish an OpenAPI specification
documentationProvider: none

# ===================
# Compatibility
# ===================
# Legacy discriminator behavior
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with OAS
disallowAdditionalPropertiesIfNotPresent: false

# Allow unicode identifiers in names
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false
