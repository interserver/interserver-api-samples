# OpenAPI Generator TypeScript Client Configuration
# Optimized for interserver-api-samples project

# --- Output & Naming ---
# Proper npm package naming for the generated client
npmName: "@interserver/api-client"
npmVersion: "1.0.0"

# Naming convention for model properties: camelCase for JavaScript conventions
modelPropertyNaming: camelCase

# Naming convention for parameters: camelCase
paramNaming: camelCase

# --- TypeScript Version ---
# Use TypeScript 4.x for better support (4.1+ features like template literal types)
typescriptMajorVersion: 4

# --- Code Quality ---
# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# --- Framework & Platform ---
# Use fetch-api framework (modern, browser-native)
framework: fetch-api

# Target browser platform (can be changed to 'node' for Node.js environments)
platform: browser

# Use ES6+ code generation
supportsES6: true

# --- Enum Configuration ---
# Use string union types instead of TypeScript enums (more tree-shakable, better for JavaScript consumers)
enumType: stringUnion

# Enum property naming convention
enumPropertyNaming: PascalCase

# Suffix for enum names
enumNameSuffix: Enum

# --- Additional Properties ---
# Set to false for compliant additionalProperties handling
disallowAdditionalPropertiesIfNotPresent: false

# --- File Handling ---
# Use Buffer for file content (Node.js compatible)
fileContentDataType: Buffer

# --- Legacy Behavior ---
# Set to false for better discriminator support
legacyDiscriminatorBehavior: false
