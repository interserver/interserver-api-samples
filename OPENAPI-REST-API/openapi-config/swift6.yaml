# OpenAPI Generator Swift6 Client Configuration
# Optimized for Swift 6.x with modern concurrency and patterns

# =============================================================================
# PROJECT IDENTITY
# =============================================================================

# Project name in Xcode - used for module name and Xcode project
projectName: InterserverAPIClient

# Prefix for API names ('tags'). Default: empty string.
# apiNamePrefix: ""

# =============================================================================
# SWIFT 6.x MODERN FEATURES
# =============================================================================

# Use AsyncAwait for API responses (Swift 6 native concurrency)
# Valid options: AsyncAwait, Combine, RxSwift, PromiseKit, ObjcBlock
responseAs: AsyncAwait

# Use final classes for models instead of structs
# Better for inheritance and JSON decoding/encoding in Swift 6
useClasses: true

# Make models conform to Hashable for collection usage
hashableModels: true

# Make models conform to Identifiable when an id is present
identifiableModels: true

# Make models conform to JSONEncodable protocol
useJsonEncodable: true

# Make properties readonly where possible
readonlyProperties: true

# =============================================================================
# CODE QUALITY & SAFETY
# =============================================================================

# Sort required parameters first in method signatures
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters first
sortModelPropertiesByRequiredFlag: true

# Ensure unique parameter names across operations
ensureUniqueParams: true

# Allow unicode identifiers in names
allowUnicodeIdentifiers: false

# Add form/body parameters at the beginning of parameter list
prependFormOrBodyParameters: false

# Generate model additional properties support
generateModelAdditionalProperties: true

# Validation rules for model properties
validatable: true

# Escape reserved words using backticks
useBacktickEscapes: true

# =============================================================================
# COMPATIBILITY OPTIONS
# =============================================================================

# Legacy discriminator behavior for backward compatibility
legacyDiscriminatorBehavior: true

# Disallow additional properties if not explicitly present
disallowAdditionalPropertiesIfNotPresent: true

# Handle unknown enum cases gracefully
enumUnknownDefaultCase: true

# Handle unknown cases in oneOf schemas
oneOfUnknownDefaultCase: true

# Map File and Binary to Data type
mapFileBinaryToData: true

# Use custom date type without time
useCustomDateWithoutTime: false

# =============================================================================
# OBJECTIVE-C COMPATIBILITY
# =============================================================================

# Add additional properties and methods for Objective-C compatibility
objcCompatible: true

# =============================================================================
# SWIFT 6 CONCURRENCY
# =============================================================================

# Make api calls using a static method (default: true)
apiStaticMethod: true

# =============================================================================
# HIDE GENERATION METADATA
# =============================================================================

# Hide the generation timestamp in file headers
hideGenerationTimestamp: true

# =============================================================================
# SWIFT PACKAGE MANAGER
# =============================================================================

# Use Swift Package Manager file structure
useSPMFileStructure: true

# =============================================================================
# HTTP LIBRARY
# =============================================================================

# HTTP client library: urlsession (default), alamofire, vapor
library: urlsession
