# JMeter Generator Configuration for InterServer API
# Optimized for proper test plan and element naming

# Sort method arguments - required params first for cleaner test data
sortParamsByRequiredFlag: true

# Sort model properties - required properties first
sortModelPropertiesByRequiredFlag: true

# Ensure unique parameter names to avoid conflicts
ensureUniqueParams: true

# Disable unicode identifiers for cleaner element names
allowUnicodeIdentifiers: false

# Place form/body parameters at the beginning of parameter list
prependFormOrBodyParameters: true

# Keep legacy discriminator behavior for compatibility
legacyDiscriminatorBehavior: true

# Disallow additional properties if not present (strict schema validation)
disallowAdditionalPropertiesIfNotPresent: false

# Handle unknown enum cases gracefully
enumUnknownDefaultCase: true

# Test Plan naming - use API title for meaningful test plan name
# This will use the info.title from openapi.yaml
# The classname will be derived from the API name

# Element naming conventions:
# - TestPlan: Uses classname (API name)
# - ThreadGroup: Uses operationId
# - HTTPSamplerProxy: Uses operationId
# - CSVDataSet: Uses operationId
