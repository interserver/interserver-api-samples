# OpenAPI Generator Configuration for Bash HTTP Client
# Optimized for cURL-based HTTP calls with proper error handling

# Sort method arguments - required params first for clearer API calls
sortParamsByRequiredFlag: true

# Sort model properties - required properties first
sortModelPropertiesByRequiredFlag: true

# Ensure unique parameter names to avoid conflicts
ensureUniqueParams: true

# Allow unicode in identifiers for international API support
allowUnicodeIdentifiers: false

# Place form/body params at the beginning for consistent structure
prependFormOrBodyParameters: true

# Use legacy discriminator behavior for OAS3 compatibility
legacyDiscriminatorBehavior: true

# Disallow additional properties if not explicitly present in schema
disallowAdditionalPropertiesIfNotPresent: true

# Default cURL options for robust HTTP calls with error handling
curlOptions: "--fail --silent --show-error --connect-timeout 30 --max-time 60"

# Convert Markdown markup to terminal formatting for help/doc output
processMarkdown: true

# Script name for generated CLI tool
scriptName: "interserver-api"

# Disable bash completion (can be enabled if shell completion is needed)
generateBashCompletion: false

# Disable zsh completion
generateZshCompletion: false

# Environment variable for API host
hostEnvironmentVariable: "INTERSERVER_API_HOST"

# Environment variable for basic auth credentials
basicAuthEnvironmentVariable: "INTERSERVER_API_CREDS"

# Environment variable for API key authentication
apiKeyAuthEnvironmentVariable: "INTERSERVER_API_KEY"

# Handle unknown enum cases gracefully
enumUnknownDefaultCase: false
