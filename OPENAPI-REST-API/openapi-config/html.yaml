# OpenAPI Generator Configuration for HTML Documentation
# Generator: html (documentation)

# Application naming - these override values from the OpenAPI spec
appName: "InterServer Management API Documentation"
appDescription: >
  API documentation for the InterServer Management API.
  This REST API provides programmatic access to manage InterServer services
  including domains, hosting, VPS, dedicated servers, backups, mail, and SSL certificates.

# Asset naming for generated artifacts
artifactId: interserver-api-docs
artifactVersion: "0.9.0"

# License information
licenseInfo: "Proprietary - InterServer Inc."
licenseUrl: "https://www.interserver.net/terms/"

# Contact information
infoUrl: "https://www.interserver.net/api/"
infoEmail: "api@interserver.net"

# Code generation behavior options
sortParamsByRequiredFlag: true
sortModelPropertiesByRequiredFlag: true
ensureUniqueParams: true
allowUnicodeIdentifiers: false
prependFormOrBodyParameters: false
legacyDiscriminatorBehavior: true
disallowAdditionalPropertiesIfNotPresent: true
enumUnknownDefaultCase: true

# Global properties (passed via -p flag when running generate)
