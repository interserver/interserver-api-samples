# OpenAPI Generator Python Client Configuration
# Optimized for interserver-api-samples project

# Package naming (snake_case convention)
packageName: interserver_api_client

# Python project name in setup.py
projectName: interserver-api-client

# Package version
packageVersion: 1.0.0

# Package URL
packageUrl: https://github.com/detain/interserver-api-samples

# Hide generation timestamp for reproducible builds
hideGenerationTimestamp: true

# Library template - urllib3 is the safe default (avoids CVE-2026-13006 affecting python_multipart)
library: urllib3

# Map number types properly for Python 3.8+ compatibility
mapNumberTo: Union[StrictFloat, StrictInt]

# Ensure required parameters appear first in method signatures for clarity
sortParamsByRequiredFlag: true

# Ensure required model properties appear first in class definitions for clarity
sortModelPropertiesByRequiredFlag: true

# Prevent duplicate parameter names across all operations
ensureUniqueParams: true

# Handle unknown enum values gracefully instead of failing - CRITICAL for forward compatibility
# When a server returns an enum value not in the current spec, use a default case instead of raising an error
enumUnknownDefaultCase: true

