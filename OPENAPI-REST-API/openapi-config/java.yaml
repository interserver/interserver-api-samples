# OpenAPI Generator Configuration for Java Client
# Optimized for Java 11+ with security best practices

# ===================
# Package Naming
# ===================
# Root package for generated code
invokerPackage: io.interserver.client

# Package for generated models
modelPackage: io.interserver.client.model

# Package for generated API classes
apiPackage: io.interserver.client.api

# ===================
# POM Metadata
# ===================
groupId: io.interserver
artifactId: interserver-api-client
artifactVersion: 1.0.0
artifactUrl: https://github.com/interserver/interserver-api-samples
artifactDescription: Interserver API Java Client
licenseName: MIT
licenseUrl: https://opensource.org/licenses/MIT

# SCM (can be customized per project)
scmConnection: scm:git:git@github.com:interserver/interserver-api-samples.git
scmDeveloperConnection: scm:git:git@github.com:interserver/interserver-api-samples.git
scmUrl: https://github.com/interserver/interserver-api-samples

# Developer info
developerName: Interserver Development Team
developerEmail: dev@interserver.net
developerOrganization: Interserver, Inc.
developerOrganizationUrl: https://www.interserver.net

# ===================
# Code Generation Options
# ===================
# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# Hides the generation timestamp when files are generated
hideGenerationTimestamp: true

# Source folder for generated code
sourceFolder: src/main/java

# ===================
# Model Options
# ===================
# Toggle "implements Serializable" for generated models
serializableModel: true

# Treat BigDecimal values as Strings to avoid precision loss
bigDecimalAsString: true

# Use Java8 classes instead of third party equivalents
java8: true

# Enable OpenAPI Jackson Nullable library
openApiNullable: true

# Set boolean getter prefix (use 'is' instead of deprecated 'get')
booleanGetterPrefix: is

# Ignore anyOf keyword in enum
ignoreAnyOfInEnum: false

# Whether the discriminator value lookup should be case-sensitive
discriminatorCaseSensitive: true

# ===================
# Library Selection
# ===================
# HTTP client library template
# okhttp-gson: HTTP client: OkHttp 4.11.0. JSON processing: Gson 2.10.1
# resttemplate: HTTP client: Spring RestTemplate 5.3.33
# native: Java native HttpClient (Java 11+)
library: okhttp-gson

# ===================
# Serialization
# ===================
# Use Gson as serialization library (default for okhttp-gson)
serializationLibrary: gson

# Disable HTML escaping of JSON strings when using gson
disableHtmlEscaping: true

# ===================
# Additional Features
# ===================
# Whether to include support for application/xml content type
withXml: false

# Use BeanValidation API annotations
useBeanValidation: false

# Perform BeanValidation
performBeanValidation: false

# Use RuntimeException instead of Exception
useRuntimeException: true

# Make API response's headers case-insensitive
caseInsensitiveResponseHeaders: false

# Use alternative types instead of java.io.File
useAbstractionForFiles: false

# ===================
# Enum Options
# ===================
# Naming convention for enum properties
enumPropertyNaming: original

# Use enum case insensitive comparison
useEnumCaseInsensitive: false

# Disable test generation
generateApiTests: false
generateModelTests: false

# If the server adds new enum cases, handle gracefully
enumUnknownDefaultCase: true

# ===================
# Compatibility Options
# ===================
# Legacy discriminator behavior
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with OAS
disallowAdditionalPropertiesIfNotPresent: false

# Allow unicode identifiers in names
allowUnicodeIdentifiers: false

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false

# ===================
# Documentation
# ===================
# Select the OpenAPI documentation provider
# none: Do not publish an OpenAPI specification
documentationProvider: none

# Select the complementary documentation annotation library
# none: Do not annotate Model and Api with complementary annotations
annotationLibrary: none

# ===================
# Security Notes
# ===================
# IMPORTANT: After generation, ensure pom.xml uses secure dependency versions:
# - jackson-databind >= 2.21.5 (CVE-2024-51111, CVE-2024-51112)
# - okhttp >= 4.12.0 (for CVE fixes)
# - tomcat-embed-core >= 10.1.20 (if using Spring/Resteasy)
#
# Add to your pom.xml <dependencyManagement> section:
# <dependency>
#   <groupId>com.fasterxml.jackson.core</groupId>
#   <artifactId>jackson-databind</artifactId>
#   <version>2.21.5</version>
# </dependency>
