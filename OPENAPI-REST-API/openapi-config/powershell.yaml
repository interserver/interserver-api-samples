# OpenAPI Generator PowerShell Client Configuration
# Optimized for InterServer Management API

# ============================================================================
# MODULE IDENTITY
# ============================================================================

# Client package name (PowerShell noun for the module)
# Follows PowerShell naming conventions: uses a noun, not a verb
packageName: InterserverApi

# Package version (semantic versioning)
packageVersion: 1.0.0

# GUID for PowerShell module (auto-generated if not specified)
# packageGuid: a27b908d-2a20-467f-bc32-af6f3a654ac5

# ============================================================================
# MODULE METADATA
# ============================================================================

# Project URL
projectUri: https://github.com/detain/interserver-api-samples

# License URL
licenseUri: https://www.interserver.net/terms-of-service.html

# ============================================================================
# CODE GENERATION OPTIONS
# ============================================================================

# Hide generation timestamp for reproducible builds
hideGenerationTimestamp: true

# Use class name in model examples for clarity
useClassNameInModelsExamples: true

# Verb used for generating model cmdlets
modelsCmdletVerb: Initialize

# PS common verb mappings (optional custom mappings)
# commonVerbs: Delete=Remove:Patch=Update

# Skip PowerShell verb parsing (use exact operation names)
# skipVerbParsing: false

# Discard readonly parameters in Initialize cmdlet
discardReadOnly: false

# Use oneOf discriminator lookup for faster model resolution
useOneOfDiscriminatorLookup: true

# ============================================================================
# PARAMETER AND MODEL ORDERING
# ============================================================================

# Sort parameters so required params appear before optional ones
# Improves cmdlet usability and follows PowerShell best practices
sortParamsByRequiredFlag: true

# Sort model properties so required properties appear before optional ones
# Ensures consistent and predictable generated model structures
sortModelPropertiesByRequiredFlag: true

# Ensure unique parameter names across all operations
# Prevents naming conflicts when same param exists in different locations
ensureUniqueParams: true

# ============================================================================
# ENUM HANDLING
# ============================================================================

# Handle unknown enum values by using the default case
# CRITICAL: Ensures forward compatibility when new enum values are added
# Generated code will handle unrecognized enum values gracefully instead of failing
enumUnknownDefaultCase: true

# ============================================================================
# SCHEMA COMPLIANCE
# ============================================================================

# Disallow additional properties if not present in schema
# false = compliant with OAS/JSON Schema specifications
# true = keep old behavior (additionalProperties defaults to false)
disallowAdditionalPropertiesIfNotPresent: true

# ============================================================================
# API CLIENT OPTIONS
# ============================================================================

# Prefix appended to all PS objects (e.g., Pet => PSPet)
# apiNamePrefix: PS

# ============================================================================
# HTTP CLIENT IMPLEMENTATION NOTES
# ============================================================================
#
# The PowerShell generator uses the following HTTP implementation:
# - Invoke-RestMethod: for multipart/form-data requests
# - Invoke-WebRequest: for all other request types
#
# This is the standard behavior of the OpenAPI Generator PowerShell template.
# Invoke-WebRequest provides access to response headers and status codes,
# which is why it's used as the default.
#
# To modify this behavior, you would need to customize the Handlebar templates
# in the generator or post-process the generated code.
#
# ============================================================================
