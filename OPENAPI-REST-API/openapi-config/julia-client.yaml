# OpenAPI Generator configuration for Julia client
# Optimized for Interserver API

# Julia package name (UpperCamelCase per Julia conventions)
packageName: InterserverAPIClient

# Whether to generate code to export model names
# Note: quoted because Julia codegen has a bug with boolean parsing
exportModels: "true"

# Whether to generate code to export operation names
# Note: quoted because Julia codegen has a bug with boolean parsing
exportOperations: "true"
