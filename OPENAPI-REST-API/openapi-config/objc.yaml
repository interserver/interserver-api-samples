# OpenAPI Generator Configuration for Objective-C
# Optimized for InterServer API Client Library

# Should generate core data models (disabled for lightweight HTTP-only client)
coreData: "false"

# Prefix for generated classes (ISA = InterServer API)
classPrefix: "ISA"

# CocoaPods package name (convention: CameCase)
podName: "InterserverAPIClient"

# CocoaPods package version
podVersion: "1.0.0"

# Author information
authorName: "InterServer"
authorEmail: "api@interserver.net"

# Git repository for the API client
gitRepoURL: "https://github.com/detain/interserver-api-samples"

# Hide generation timestamp to avoid unnecessary file changes
hideGenerationTimestamp: "true"
