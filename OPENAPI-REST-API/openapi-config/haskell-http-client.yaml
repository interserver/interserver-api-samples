# OpenAPI Generator Config for Haskell HTTP Client
# Optimized for Interserver API

# === Module & Package Naming ===
# Base module namespace for generated Haskell modules
baseModule: Interserver.Api

# Cabal package name
cabalPackage: interserver-api-client

# Cabal version
cabalVersion: 0.1.0.0

# === Parameter & Model Sorting ===
# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# === JSON & Serialization (Aeson) ===
# Allow JSON Null during model decoding
allowFromJsonNulls: true

# Allow emitting JSON Null during model encoding
allowToJsonNulls: false

# Generate specific datatypes for OpenAPI enums
generateEnums: true

# Generate FromForm/ToForm instances
generateFormUrlEncodedInstances: true

# === Model Generation ===
# Generate Lens optics for Models
generateLenses: true

# Generate smart constructors (only supply required fields)
generateModelConstructors: true

# Add strictness annotations to all model fields
strictFields: true

# Inline (hardcode) content-type and accept parameters when only 1 option
inlineMimeTypes: true

# === HTTP Client Settings ===

# Date format for date fields
dateFormat: "%Y-%m-%d"

# === Additional Settings ===
# Allow unicode identifiers in names
allowUnicodeIdentifiers: false

# Add form/body parameters to beginning of parameter list
prependFormOrBodyParameters: false

# Legacy discriminator behavior for backward compatibility
legacyDiscriminatorBehavior: true

# Disallow additional properties if not present (OAS compliance)
disallowAdditionalPropertiesIfNotPresent: true

# Handle unknown enum cases gracefully
enumUnknownDefaultCase: true

# Allow non-unique operationIds (requires qualified imports)
allowNonUniqueOperationIds: false

# Hide generation timestamp in generated files
hideGenerationTimestamp: true
