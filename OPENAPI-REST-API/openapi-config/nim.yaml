# Nim OpenAPI Generator Configuration
# Optimized for interserver-api-samples REST API client generation

# Description: Sort method arguments to place required parameters before optional parameters.
# Ensures API function signatures have required params first for better ergonomics
sortParamsByRequiredFlag: "true"

# Description: Sort model properties to place required parameters before optional parameters.
# Struct fields will have required fields first, then optional fields
sortModelPropertiesByRequiredFlag: "true"

# Description: Whether to ensure parameter names are unique in an operation (rename parameters that are not).
# Prevents parameter name collisions in complex operations
ensureUniqueParams: "true"

# Description: boolean, toggles whether unicode identifiers are allowed in names or not, default is false
# Disabled to maintain ASCII-only identifiers for maximum compatibility
allowUnicodeIdentifiers: "false"

# Description: Add form or body parameters to the beginning of the parameter list.
# Keeps parameter order intuitive with body/form params first
prependFormOrBodyParameters: "false"

# Description: Set to false for generators with better support for discriminators.
# Using default behavior for proper polymorphism support
legacyDiscriminatorBehavior: "true"

# Description: If false, the 'additionalProperties' implementation is compliant with the OAS and JSON schema specifications.
# Enabled for stricter typing - only allow additionalProperties where explicitly defined in spec
disallowAdditionalPropertiesIfNotPresent: "true"

# Description: If the server adds new enum cases, that are unknown by an old spec/client,
# the client will fail to parse the network response. With this option enabled, each enum
# will have a new case, 'unknown_default_open_api'.
# Enabled for forward compatibility with API enum extensions
enumUnknownDefaultCase: "true"
