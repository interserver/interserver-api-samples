# OpenAPI Generator Configuration for Apex (Salesforce/Oracle)
# Optimized for Salesforce API compatibility and proper class naming

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Ensure parameter names are unique in an operation
ensureUniqueParams: true

# Allow unicode identifiers in names (recommended for international characters)
allowUnicodeIdentifiers: false

# Place form/body parameters at the beginning of parameter list
prependFormOrBodyParameters: true

# Use legacy discriminator behavior for better compatibility
legacyDiscriminatorBehavior: true

# Disallow additional properties if not present (strict schema validation)
disallowAdditionalPropertiesIfNotPresent: false

# Allow unknown enum cases to be handled gracefully
enumUnknownDefaultCase: true

# Prefix for generated classes - prevents overwriting existing classes in the org
# Using 'IntServer' prefix for InterServer API classes
classPrefix: "IntServer_"

# Metadata API version - set to a recent stable version
apiVersion: "59.0"

# Build method for the package (sfdx, ant, or maven)
buildMethod: "sfdx"

# Named Credential name for HTTP callouts - should match your Salesforce org's Named Credential
# This is the auth mechanism for API calls
namedCredential: "Interserver_API"

# Additional Apex-specific settings:
