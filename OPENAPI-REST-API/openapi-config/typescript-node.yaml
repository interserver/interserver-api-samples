# OpenAPI Generator Config for TypeScript-Node
# Optimized for Node.js environment with proper npm package structure

# === Npm Package Configuration ===
# The name under which you want to publish generated npm package
npmName: "@interserver/api-client"

# The version of your npm package
npmVersion: 1.0.0

# When set to true, the version will be suffixed with -SNAPSHOT.yyyyMMddHHmm
snapshot: false

# Use this property to set an url your private npmRepo in the package.json
# npmRepository: https://registry.npmjs.org/

# === Naming Conventions ===
# Naming convention for parameters: 'camelCase', 'PascalCase', 'snake_case' and 'original'
paramNaming: camelCase

# Naming convention for the property: 'camelCase', 'PascalCase', 'snake_case' and 'original'
modelPropertyNaming: PascalCase

# Naming convention for enum properties: 'camelCase', 'PascalCase', 'snake_case', 'UPPERCASE', and 'original'
enumPropertyNaming: PascalCase

# Suffix that will be appended to all enum names
enumNameSuffix: Enum

# Set to true to replace '-' and '+' symbols with 'minus_' and 'plus_' in enum of type string
enumPropertyNamingReplaceSpecialChar: false

# === Generation Options ===
# Generate code that conforms to ES6 (set to true for modern Node.js)
supportsES6: true

# Sort method arguments to place required parameters before optional parameters
sortParamsByRequiredFlag: true

# Sort model properties to place required parameters before optional parameters
sortModelPropertiesByRequiredFlag: true

# Whether to ensure parameter names are unique in an operation
ensureUniqueParams: true

# Add form or body parameters to the beginning of the parameter list
prependFormOrBodyParameters: false

# boolean, toggles whether unicode identifiers are allowed in names or not
allowUnicodeIdentifiers: false

# === Model & Enum Options ===
# Set to false for generators with better support for discriminators
legacyDiscriminatorBehavior: true

# If false, the 'additionalProperties' implementation is compliant with OAS and JSON schema specifications
disallowAdditionalPropertiesIfNotPresent: false

# Set to make additional properties types declare that their indexer may return undefined
nullSafeAdditionalProps: false

# If the server adds new enum cases, that are unknown by an old spec/client, the client will fail to parse
enumUnknownDefaultCase: false

# === Metadata ===
# Hide the generation timestamp in generated code
hideGenerationTimestamp: true

# The name of the license
licenseName: MIT
